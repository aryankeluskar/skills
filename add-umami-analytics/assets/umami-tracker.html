<!-- Umami analytics. Paste before </head>. Replace:
       SCRIPT_URL   -> your umami script URL (default https://cloud.umami.is/script.js)
       WEBSITE_ID   -> the site's umami website id
       PROD_HOSTNAME -> production hostname(s), comma-separated (fork guard: a clone on
                        another domain sends nothing). Drop data-domains only if intentional. -->
<script defer src="SCRIPT_URL" data-website-id="WEBSITE_ID" data-domains="PROD_HOSTNAME"></script>
<script>
(function () {
  var SEL = 'a, button, [role="button"], input[type="submit"], input[type="button"]';
  function label(el, isLink) {
    var raw = el.getAttribute('aria-label') || el.innerText || el.value || el.getAttribute('title') || (isLink ? (el.getAttribute('href') || '') : '') || el.tagName.toLowerCase();
    return raw.replace(/\s+/g, ' ').trim().slice(0, 40);
  }
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
    if (!el || !window.umami) return;
    var isLink = el.tagName === 'A';
    var name = (isLink ? 'link: ' : 'button: ') + label(el, isLink);
    window.umami.track(name.slice(0, 50), {
      type: isLink ? 'link' : 'button',
      text: (el.innerText || el.value || '').replace(/\s+/g, ' ').trim().slice(0, 200),
      href: isLink ? el.href : undefined,
      id: el.id || undefined,
      aria: el.getAttribute('aria-label') || undefined,
      path: window.location.pathname
    });
  }, true);
})();
</script>
